[package]
name = "hotspots-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rust symbol resolver for hotspots function-grain analysis."
readme = "../../README.md"
repository = "https://github.com/deangrant/hotspots"
keywords = ["git", "rust", "symbols", "hotspots"]
categories = ["development-tools"]

[dependencies]
hotspots = { path = "../hotspots", version = "0.1.0" }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "extra-traits"] }

[lints]
workspace = true
