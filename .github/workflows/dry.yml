name: dry

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-rs:
    name: Structural clones (dry-rs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.94.0

      - name: Detect workspace packages
        id: pkgs
        run: |
          count=$(.github/scripts/package-count.sh)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" = "0" ]; then
            echo "No workspace packages; skipping dry-rs."
          fi

      - name: Read dry-score pin
        id: dry_pin
        if: steps.pkgs.outputs.count != '0'
        run: |
          echo "ref=$(tr -d '[:space:]' <scripts/dry-score.rev)" >> "$GITHUB_OUTPUT"

      - name: Checkout dry-score pin
        if: steps.pkgs.outputs.count != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: deangrant/dry-score
          ref: ${{ steps.dry_pin.outputs.ref }}
          path: .tools/dry-score
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.pkgs.outputs.count != '0'
        with:
          workspaces: |
            .
            .tools/dry-score

      - name: dry-rs gate (fail on findings)
        if: steps.pkgs.outputs.count != '0'
        env:
          DRY_SCORE_DIR: ${{ github.workspace }}/.tools/dry-score
        run: ./scripts/dry-gate.sh
