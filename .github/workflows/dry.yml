name: dry

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-rs:
    name: Structural clones (dry-rs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.94.0

      - name: Detect workspace packages
        id: pkgs
        run: |
          count=$(.github/scripts/package-count.sh)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" = "0" ]; then
            echo "No workspace packages; skipping dry-rs."
          fi

      - name: dry-rs gate (fail on findings)
        if: steps.pkgs.outputs.count != '0'
        run: ./scripts/dry-gate.sh
