name: coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  llvm-cov:
    name: Line coverage 100%
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      count: ${{ steps.pkgs.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.94.0
          components: llvm-tools-preview

      - name: Detect workspace packages
        id: pkgs
        run: |
          count=$(.github/scripts/package-count.sh)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" = "0" ]; then
            echo "No workspace packages; skipping coverage."
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.pkgs.outputs.count != '0'
        with:
          workspaces: .

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        if: steps.pkgs.outputs.count != '0'
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Line coverage must be 100%
        if: steps.pkgs.outputs.count != '0'
        run: |
          cargo llvm-cov --workspace --all-features --locked \
            --lcov --output-path lcov.info \
            --fail-under-lines 100

      - name: Upload lcov.info
        if: steps.pkgs.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov-info
          path: lcov.info
          if-no-files-found: error
          retention-days: 1

  crap-gate:
    name: CRAP gate (strict / 8)
    needs: llvm-cov
    if: needs.llvm-cov.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.94.0

      - name: Read crap-score pin
        id: crap_pin
        run: |
          echo "ref=$(tr -d '[:space:]' <scripts/crap-score.rev)" >> "$GITHUB_OUTPUT"

      - name: Checkout crap-score pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: deangrant/crap-score
          ref: ${{ steps.crap_pin.outputs.ref }}
          path: .tools/crap-score
          persist-credentials: false

      - name: Download lcov.info
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lcov-info
          path: .

      - name: CRAP gate (strict / 8)
        env:
          CRAP_SCORE_DIR: ${{ github.workspace }}/.tools/crap-score
        run: ./scripts/crap-gate.sh
