name: coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  llvm-cov:
    name: Line coverage 100%
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    outputs:
      count: ${{ steps.pkgs.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.94.0
          components: llvm-tools-preview

      - name: Detect workspace packages
        id: pkgs
        run: |
          count=$(.github/scripts/package-count.sh)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" = "0" ]; then
            echo "No workspace packages; skipping coverage."
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.pkgs.outputs.count != '0'
        with:
          workspaces: .

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        if: steps.pkgs.outputs.count != '0'
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Line coverage must be 100%
        if: steps.pkgs.outputs.count != '0'
        run: |
          cargo llvm-cov --workspace --all-features --locked \
            --lcov --output-path lcov.info \
            --fail-under-lines 100

      - name: Upload lcov.info
        if: steps.pkgs.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-info
          path: lcov.info
          if-no-files-found: error
          retention-days: 1

  crap-gate:
    name: CRAP gate (strict / 8)
    needs: llvm-cov
    if: needs.llvm-cov.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.94.0

      - name: Download lcov.info
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lcov-info
          path: .

      - name: CRAP gate (strict / 8)
        run: ./scripts/crap-gate.sh
